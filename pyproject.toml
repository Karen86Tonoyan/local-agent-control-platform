[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-core"
version = "0.1.0"
description = "ALFA-CORE backend kernel: routing, safety, and local model integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0"
]

[tool.setuptools]
packages = ["apps", "apps.api", "apps.worker", "apps.cli", "packages", "packages.router", "packages.safety", "packages.llm", "packages.telemetry"]
